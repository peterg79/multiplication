<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Times Table Hero</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="timestable.css">
  <!-- SVG Favicon for modern browsers -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Standard PNG Favicon fallback for legacy browsers (Convert SVG to 32x32 PNG) -->
  <link rel="alternate icon" href="favicon.ico">

  <!-- iOS Web App Home Screen Icon -->
  <!-- Note: iOS will automatically apply its own squircle mask to Apple Touch Icons, -->
  <!-- but using this full square graphic keeps the exact frame styling you requested. -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Web App Manifest for progressive web apps (optional) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="py-2">

  <div class="container px-2">
    <div class="card game-card shadow-sm border">
      <div class="card-body p-3 text-center">

        <!-- Header: Scoreboard + Theme Switcher -->
        <div class="d-flex justify-content-between align-items-center mb-2 pb-1 border-bottom">
          <button id="theme-toggle" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
            🌙
          </button>
          <div class="d-flex align-items-center gap-2">
            <span class="fs-6 text-body-secondary">Score</span>
            <span id="score" class="fs-4 fw-bold text-primary">0</span>
          </div>
        </div>

        <!-- Inline Feedback Banner -->
        <div class="feedback-container mb-1">
          <div id="feedback" class="alert py-1 px-3 m-0 fw-bold small hidden" role="alert"></div>
        </div>

        <!-- Question Display -->
        <div class="mb-2">
          <span id="question" class="display-6 fw-bold">0 × 0 = ?</span>
        </div>

        <!-- Answer Input Screen -->
        <div class="mb-3">
          <div id="answer-display" class="form-control display-screen fw-semibold text-center">&nbsp;</div>
        </div>

        <!-- Equal-Spaced CSS Grid Dialpad -->
        <div class="dialpad-grid mb-3">
          <button class="btn btn-outline-secondary dialpad-btn" onclick="appendDigit('1')">1</button>
          <button class="btn btn-outline-secondary dialpad-btn" onclick="appendDigit('2')">2</button>
          <button class="btn btn-outline-secondary dialpad-btn" onclick="appendDigit('3')">3</button>

          <button class="btn btn-outline-secondary dialpad-btn" onclick="appendDigit('4')">4</button>
          <button class="btn btn-outline-secondary dialpad-btn" onclick="appendDigit('5')">5</button>
          <button class="btn btn-outline-secondary dialpad-btn" onclick="appendDigit('6')">6</button>

          <button class="btn btn-outline-secondary dialpad-btn" onclick="appendDigit('7')">7</button>
          <button class="btn btn-outline-secondary dialpad-btn" onclick="appendDigit('8')">8</button>
          <button class="btn btn-outline-secondary dialpad-btn" onclick="appendDigit('9')">9</button>

          <button class="btn btn-outline-danger dialpad-btn fs-6" onclick="clearAnswer()">AC</button>
          <button class="btn btn-outline-secondary dialpad-btn" onclick="appendDigit('0')">0</button>
          <button class="btn btn-outline-warning dialpad-btn fs-5" onclick="deleteLastDigit()">⌫</button>
        </div>

        <!-- Action Buttons -->
        <div class="d-grid gap-2">
          <button class="btn btn-primary btn-lg fw-semibold py-2" onclick="submitAnswer()">Submit</button>
          <div class="row g-2">
            <div class="col-6">
              <button class="btn btn-outline-primary btn-sm w-100 py-1" onclick="generateQuestion()">New Question</button>
            </div>
            <div class="col-6">
              <button class="btn btn-outline-danger btn-sm w-100 py-1" onclick="resetProgress()">Reset Progress</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="timestable.js"></script>
</body>
</html>
